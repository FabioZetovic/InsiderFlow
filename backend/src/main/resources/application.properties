spring.application.name=insiderflow

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/insiderflow}
spring.data.mongodb.auto-index-creation=true

server.port=8080

# JWT — empty default means a random per-process key is generated (sessions reset on restart);
# set JWT_SECRET (>= 64 chars) for persistent sessions.
insiderflow.jwt.secret=${JWT_SECRET:}
insiderflow.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS — comma-separated allowed origins. Set CORS_ALLOWED_ORIGINS to the deployed frontend URL
# (e.g. https://insiderflow.vercel.app). Defaults to the local dev frontend.
insiderflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Set to false to close public sign-ups after you've created your account(s).
insiderflow.auth.registration-enabled=${REGISTRATION_ENABLED:true}

# Demo mode: any email + any password logs in (find-or-create). For public demos. Default OFF.
insiderflow.auth.demo-mode=${DEMO_MODE:false}

# Cap request body size (defense against oversized-payload memory pressure).
spring.servlet.multipart.max-request-size=1MB
server.tomcat.max-swallow-size=2MB

# Honor X-Forwarded-* from the hosting proxy (Railway/Render/etc.) so client IPs (used by the
# auth rate limiter) and HTTPS scheme are correct behind TLS termination.
server.forward-headers-strategy=framework

# Finnhub
insiderflow.finnhub.api-key=${FINNHUB_API_KEY:}
insiderflow.finnhub.base-url=https://finnhub.io/api/v1

# Congress trade data sources
insiderflow.trades.senate-url=https://senate-stock-watcher-data.s3-us-west-2.amazonaws.com/aggregate/all_transactions.json
insiderflow.trades.house-url=https://house-stock-watcher-data.s3-us-west-2.amazonaws.com/data/all_transactions.json
insiderflow.trades.senate-fallback-url=https://raw.githubusercontent.com/timothycarambat/senate-stock-watcher-data/master/aggregate/all_transactions.json
insiderflow.trades.house-fallback-url=https://raw.githubusercontent.com/TattooedHead/house-stock-watcher-data/main/data/all_transactions.json
insiderflow.trades.ingest-on-startup=true
# Trump OGE 278-T dataset (cleaned mirror of the 2026-05-08 filing, 3642 transactions)
insiderflow.trades.trump-url=https://raw.githubusercontent.com/HerringtonDarkholme/trump-portfolio-tracker/main/src/data/dataset.json
insiderflow.trades.trump-ptr-link=https://extapps2.oge.gov/201/Presiden.nsf/PAS+Index/405E4EC4E27BE8D185258DF7002DD1C0/$FILE/Trump,%20Donald%20J.-05.08.2026-278T(2).pdf
# Local output of the Senate eFD scraper (scripts/senate-efd-scraper.js) — ingested when present
insiderflow.trades.senate-local-file=${SENATE_EFD_FILE:../data/senate_efd_transactions.json}

logging.level.com.insiderflow=INFO

# SEC EDGAR (Form 4 corporate insiders). SEC requires a descriptive User-Agent with contact info.
insiderflow.sec.enabled=${SEC_ENABLED:true}
# Set SEC_USER_AGENT to "AppName/1.0 (your-contact-email)" — SEC requires a real contact.
insiderflow.sec.user-agent=${SEC_USER_AGENT:InsiderFlow/1.0 (contact via deployment owner)}
